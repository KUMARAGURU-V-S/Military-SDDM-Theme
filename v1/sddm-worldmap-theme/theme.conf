[General]
# ─── COLORS ───
accentColor=#00d4ff
backgroundColor=#0a0e17
cardColor=#1a1e2e
textColor=#e8e8e8
errorColor=#ff4757
successColor=#2ed573

# ─── CARD ───
cardOpacity=0.88
cardWidth=400
cardRadius=16
cardBlur=true

# ─── MAP ───
# Initial map center (lat, lon) and zoom level
defaultLatitude=20.0
defaultLongitude=0.0
defaultZoom=2.5
# Maximum zoom level allowed
maxZoom=12
# Minimum zoom level allowed
minZoom=1
# Enable smooth zoom/pan animations
animationsEnabled=true
# Animation duration in ms
animationDuration=1200
# Map darkening overlay opacity (0.0 = none, 1.0 = full black)
mapDarken=0.25
# Show country navigation panel
showCountryNav=true
# Country nav panel position: "left" or "right"
countryNavPosition=left
# Country nav panel width
countryNavWidth=220

# ─── CLOCK ───
showClock=true
clockFormat=hh:mm
dateFormat=dddd, MMMM d, yyyy
use24HourClock=true

# ─── FONTS ───
fontFamily=sans-serif
fontSize=14
clockFontSize=48

# ─── MISC ───
showSessionSelector=true
showVirtualKeyboard=false
# Cache directory for map tiles (relative to theme dir or absolute path)
tileCacheDir=/var/cache/sddm-worldmap-tiles
